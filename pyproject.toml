[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repomatch"
version = "0.1.0"
description = "Reproducible GitHub repository collection for personalized open source matching"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0,<2",
    "rank-bm25",
    "scikit-learn",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1"
]
[project.scripts]
repomatch = "repomatch.collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

